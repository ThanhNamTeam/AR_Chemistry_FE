# 3G là đủ cho build Flutter+AGP (kể cả unityLibrary — phần nặng là NDK chạy
# process riêng, không ăn heap Gradle). Cấu hình cũ -Xmx8G + metaspace 4G khiến
# daemon không khởi động nổi khi máy đang chạy emulator + Docker (malloc fail).
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
android.useAndroidX=true
android.enableJetifier=true
kotlin.incremental=false
unityStreamingAssets=
# Toolchain used by :unityLibrary:buildIl2Cpp (see unityLibrary/build.gradle -> buildIl2CppImpl).
# These MUST match unityLibrary/build.gradle lines 12-13:
#   ndkPath    "C:/Program Files/Unity/Hub/Editor/6000.4.7f1/.../AndroidPlayer/NDK"
#   ndkVersion "27.2.12479018"
# The previous values pointed at D:\Android\Sdk\ndk\28.2.13676358, which does not exist on
# this machine (there is no D:\Android\Sdk at all) and was also the wrong NDK major version,
# so il2cpp.exe aborted with exit code 4.
# Unity 6000.4.7f1 bundles NDK r27c (27.2.12479018) and IL2CPP must be built with it.
unity.androidSdkPath=C\:\\Users\\ACER\\AppData\\Local\\Android\\sdk
unity.androidNdkPath=C\:\\Program Files\\Unity\\Hub\\Editor\\6000.4.7f1\\Editor\\Data\\PlaybackEngines\\AndroidPlayer\\NDK
unity.androidNdkVersion=27.2.12479018

# Was D:\AndroidStudio\jbr, which does not exist. The build only worked because
# ~/.gradle/gradle.properties overrides this key; set it correctly here so the project
# is self-contained.
org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio\\jbr