# ─── Project identity ────────────────────────────────────────────────────────
sonar.projectKey=labedu
sonar.projectName=LABEDU – AR Chemistry Learning
sonar.projectVersion=1.0.0

# ─── Source / language ───────────────────────────────────────────────────────
sonar.sources=lib
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Requires sonar-flutter plugin:
# https://github.com/insideapp-oss/sonar-flutter
# Copy JAR to $SONARQUBE_HOME/extensions/plugins/ then restart container.
sonar.language=dart

# ─── Exclusions ──────────────────────────────────────────────────────────────
sonar.exclusions=\
  **/*.g.dart,\
  **/*.freezed.dart,\
  **/generated/**,\
  packages/**,\
  android/**,\
  ios/**,\
  macos/**,\
  windows/**,\
  linux/**,\
  web/**,\
  unityLibrary/**,\
  launcher/**,\
  .dart_tool/**,\
  build/**,\
  **/build/**,\
  analysis_options.yaml,\
  pubspec.yaml,\
  pubspec.lock

sonar.test.exclusions=test/**

# ─── Flutter Analyzer report (pre-generated) ─────────────────────────────────
# Generate BEFORE scanning (PowerShell, no BOM):
#   flutter analyze --no-fatal-infos --no-fatal-warnings | Out-File flutter-analyze-report.txt -Encoding utf8NoBOM
# Absolute path avoids the plugin ignoring a relative/BOM file and re-running analyze (can hang).
sonar.dart.analyzer.reportPaths=D:/FPT/Ki8_FPT/EXE201/AR_Chemistry_Visual/AR_Chemistry_FE/flutter-analyze-report.txt

# ─── Coverage ────────────────────────────────────────────────────────────────
# Generate with: flutter test --coverage
# Output file : coverage/lcov.info
sonar.dart.lcov.reportPaths=D:/FPT/Ki8_FPT/EXE201/AR_Chemistry_Visual/AR_Chemistry_FE/coverage/lcov.info

# Files excluded from COVERAGE computation only (still analysed for code quality).
# Rationale: these files are either generated, platform-specific, pure constants,
# or require live external services (HTTP, Cognito, FCM) that cannot be unit-tested.
sonar.coverage.exclusions=\
  lib/core/api/**,\
  lib/core/constants/**,\
  lib/core/config/**,\
  lib/core/auth/cognito_service.dart,\
  lib/core/l10n/**,\
  lib/core/navigation/**,\
  lib/core/services/auth_token_service.dart,\
  lib/core/storage/avatar_storage_service.dart,\
  lib/routes/**,\
  lib/services/**,\
  lib/shared/**,\
  lib/presentation/**,\
  lib/main.dart

# ─── Quality Gate targets ────────────────────────────────────────────────────
# Enforce in SonarQube UI → Quality Gates:
#   Line coverage        >= 80 %
#   Branch coverage      >= 80 %
#   Duplicated lines     <= 3 %

# ─── SonarQube server (Docker) ───────────────────────────────────────────────
sonar.host.url=http://localhost:9000
# Token: set via CLI flag  -Dsonar.token=<your_token>
#        or env var        SONAR_TOKEN=<your_token>

# ─── Flutter SDK (sonar-flutter plugin) ──────────────────────────────────────
# Must match the real Flutter install (this machine: D:\flutter)
sonar.flutter.sdk.directory=D:/flutter
